[gcode_macro POOP]
description: Rotina de descarte/blob FINAL com Chute e WIPE em Z1.0 (SP5)
gcode:
    {% set x_poop = 15 %}    ; Coordenada X de início do blob (onde o blob é criado)
    {% set y_poop = 15 %}    ; Coordenada Y
    {% set x_chute_start = 60 %}   ; Ponto de partida do chute 
    {% set x_borda_final = 1 %}  ; Coordenada X final para o chute (Borda esquerda)
    {% set z_start = 0.3 %}  ; Altura inicial para o blob (0.3mm)
    {% set z_length = 15.0 %}; Distância que o bico subirá (Mesa descerá) durante a purga.
    {% set extrusion_vol_total = 75.0 %} ; Volume total de filamento (E75)
    {% set e_prime = 10.0 %} ; Volume para a purga inicial (E10)
    {% set e_coordinada = extrusion_vol_total - e_prime %} ; Volume restante (E65)

    M117 Descarte Lento - Purga e Sincronizado!
    
    G90 ; Posicionamento absoluto
    G92 E0 ; Resetar extrusora
    
    # 1. MOVIMENTO SEGURO E POSICIONAMENTO
    G1 E-1 F4800 
    G1 Z{z_start + 10} F12000 
    G1 X{x_poop} Y{y_poop} F12000.0 

    # 2. POSIÇÃO DE INÍCIO (0.3mm), PRIME E PAUSA
    M117 Pre-Extrusao em Z0.3...
    G1 Z{z_start} F9000 
    M106 S150 
    G1 E{e_prime} F300 
    M117 Aguardando 2s para Pressao...
    G4 P2000 
    
    # 3. EXTRUSÃO COORDENADA (ULTRALENTA)
    M117 Extrusão Sincronizada, Velocidade Ultrabaixa!
    G1 Z{z_start + z_length} E{e_coordinada} F30 
    
    # --- 4. CHUTE, CORTE E FINALIZAÇÃO (AJUSTADO) ---
    M117 Corte e Chute Rápido em Z1.0...
    
    # 4A. MOVIMENTO DE PREPARAÇÃO: Vai para X60 (altura segura de 15mm+)
    G1 X{x_chute_start} Y{y_poop} F12000 
    
    # 4B. DESCE PARA Z1.0
    G1 Z1.0 F9000 ; Desce o bico (mesa sobe) para 1.0mm de altura.
    
    # 4C. MOVIMENTO DE CHUTE/LIMPEZA (X60 -> X1 em Z1.0)
    # Move X rapidamente de 60mm até a borda esquerda (X1) para chutar o blob, limpando-o em Z1.0
    G1 X{x_borda_final} Y{y_poop} F18000 ; Chute em X=1 (velocidade máxima)
    
    # 4D. LIMPEZA ADICIONAL
    G1 X{x_borda_final - 2} F18000 
    
    # 5. RETORNO À SEGURANÇA
    G1 Z30 F9000 ; Levanta o bico para altura de segurança final
    M106 S0 ; Desliga o ventilador
    G92 E0 ; Resetar extrusora no final

    M117 Impressão Continua!