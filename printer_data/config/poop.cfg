[gcode_macro POOP]
description: Rotina de purge anti-grude/anti-amasso (Push-Pull SP5 - Two Trees/Sherpa)
gcode:
    {% set x_poop = 20 %}             ; posição para formar o blob
    {% set y_poop = 15 %}
    {% set x_chute = x_poop + 12 %}   ; início do arraste lateral (12mm à direita)
    {% set x_borda = x_poop - 9 %}    ; borda esquerda do arraste
    {% set z_blob = 0.7 %}            ; altura para formar e chutar o blob (fica ~0.7mm acima da mesa)
    {% set z_safety = 15 %}
    {% set extrusion_total = 50.0 %}  ; menos volume para blob menor
    {% set e_prime = 7.0 %}
    {% set e_blob = extrusion_total - e_prime %}
    {% set retract_before_chute = 2.7 %}
    {% set retract_final = 1.5 %}
    {% set chute_speed = 8000 %}      ; velocidade suficiente (pode ajustar entre 6000–12000)
    {% set fan_blob = 210 %}          ; ventoinha forte para resfriar blob

    SAVE_GCODE_STATE NAME=POOP_STATE
    G90
    M83
    G92 E0

    ; Desloca, sobe e posiciona bico
    G1 X{x_poop} Y{y_poop} Z{z_safety} F12000
    G1 Z{z_blob} F8000

    ; Prime inicial
    M106 S{fan_blob}
    G1 E{e_prime} F250
    G4 P1000              ; pausa para o início fundir melhor

    ; Formando o blob (subindo micro-Z para engrossar)
    G1 Z{z_blob+0.5} E{e_blob * 0.5} F50
    G1 Z{z_blob}     E{e_blob * 0.5} F35

    ; Pausa curta para endurecimento (determinante!)
    G4 P1200

    ; Retração agressiva antes do chute
    G1 E-{retract_before_chute} F6000

    ; Volta para altura exata do blob antes de chutar
    G1 Z{z_blob+0.2} F4000

    ; “Empurra” lateralmente - bico passa pegando a lateral do blob
    G1 X{x_chute} Y{y_poop} F{chute_speed}
    G1 X{x_borda} Y{y_poop} F{chute_speed}
    G1 X{x_poop+3} Y{y_poop} F10000  ; retorna ao lado do print

    ; Retração extra para limpar bico
    G1 E-{retract_final} F4800

    ; Sobe para segurança
    G1 Z{z_safety} F10000
    M106 S0
    G92 E0

    RESTORE_GCODE_STATE NAME=POOP_STATE
    M117 POOP: OK - Blob removido!
