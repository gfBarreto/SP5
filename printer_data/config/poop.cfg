[gcode_macro POOP]
description: Rotina de descarte/blob com Chute + Wipe SEM descer Z (anti-achatamento) - SP5
gcode:
    # === POSIÇÕES ===
    {% set x_poop = 15 %}               ; onde forma o blob
    {% set y_poop = 15 %}
    {% set x_chute_start = 60 %}        ; início do chute
    {% set x_borda_final = 2 %}         ; borda esquerda (evita X=0)
    {% set x_wipe_back = x_borda_final + 4 %}

    # === Z / FORMAÇÃO DO BLOB ===
    {% set z_start = 0.30 %}
    {% set z_length = 12.0 %}           ; sobe Z enquanto extruda
    {% set z_kick_extra = 2.0 %}        ; EXTRA: chute acontece acima do final da purga
    {% set z_safe = 30.0 %}

    # === EXTRUSÃO ===
    {% set extrusion_total = 60.0 %}
    {% set e_prime = 8.0 %}
    {% set e_blob = extrusion_total - e_prime %}

    # === ANTI-GRUDAMENTO ===
    {% set retract_before_move = 2.5 %}
    {% set retract_final = 1.0 %}
    {% set chute_speed = 22000 %}

    M117 POOP: Purga + Chute (no-drop Z)

    SAVE_GCODE_STATE NAME=POOP_STATE
    G90
    M83
    G92 E0

    # 1) Posicionamento seguro
    G1 E-1.0 F4800
    G1 Z{z_start + 15.0} F12000
    G1 X{x_poop} Y{y_poop} F12000

    # 2) Prime
    M106 S120
    G1 Z{z_start} F9000
    G1 E{e_prime} F240
    G4 P1500

    # 3) Blob subindo Z
    G1 Z{z_start + (z_length * 0.4)} E{e_blob * 0.5} F45
    G1 Z{z_start + (z_length * 0.8)} E{e_blob * 0.3} F35
    G1 Z{z_start + z_length}         E{e_blob * 0.2} F25

    # 4) Preparar chute (SEM descer Z)
    G4 P800
    G1 E-{retract_before_move} F4800

    ; Sobe mais um pouco para chutar sem chance de amassar o blob
    G1 Z{z_start + z_length + z_kick_extra} F9000

    ; Vai para início do chute mantendo Z alto
    G1 X{x_chute_start} Y{y_poop} F15000

    # 5) Chute + wipe (tudo em Z alto)
    G1 X{x_borda_final} F{chute_speed}
    G1 X{x_wipe_back}   F{chute_speed}
    G1 X{x_borda_final} F{chute_speed}

    # 6) Finalização
    G1 E-{retract_final} F3600
    G1 Z{z_safe} F12000
    M106 S0
    G92 E0

    RESTORE_GCODE_STATE NAME=POOP_STATE
    M117 POOP: OK
