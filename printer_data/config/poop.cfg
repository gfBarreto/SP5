[gcode_macro POOP]
description: Rotina de descarte/blob com anti-grudamento - SP5 (Two Trees + Sherpa + TZ6 v2)
gcode:
    # === CONFIGURAÇÕES PRINCIPAIS ===
    {% set x_poop = 15 %}              ; X onde forma o blob
    {% set y_poop = 15 %}              ; Y fixo para o blob
    {% set x_chute_start = 60 %}       ; início do movimento de chute
    {% set x_borda_final = 2 %}        ; borda esquerda (evita X=0 por segurança)
    {% set z_start = 0.30 %}           ; altura inicial do blob
    {% set z_length = 12.0 %}          ; quanto sobe Z durante extrusão (reduzido)
    
    # === VOLUMES DE EXTRUSÃO ===
    {% set extrusion_total = 65.0 %}   ; total reduzido (era 75, agora 60 = blob menor)
    {% set e_prime = 8.0 %}            ; prime inicial (reduzido de 10 para 8)
    {% set e_blob = extrusion_total - e_prime %}
    
    # === CONFIGURAÇÕES ANTI-GRUDAMENTO ===
    {% set retract_before_move = 3 %}     ; retração forte antes do chute
    {% set retract_final = 1.0 %}           ; retração final
    {% set z_chute = 2.5 %}                 ; altura do chute (era 1.0, agora 2.2)
    {% set chute_speed = 22000 %}           ; velocidade máxima do chute
    
    # === CLAMPS DE SEGURANÇA ===
    {% set x_wipe_back = x_borda_final + 4 %}  ; volta 4mm para dentro no wipe

    M117 POOP: Iniciando descarte SP5...

    # === SALVAR ESTADO E CONFIGURAR MODOS ===
    SAVE_GCODE_STATE NAME=POOP_STATE
    G90                  ; XY absoluto
    M83                  ; extrusão relativa
    G92 E0               ; zerar contador de extrusão

    # === 1. MOVIMENTO SEGURO E POSICIONAMENTO ===
    M117 POOP: Posicionando...
    G1 E-1.0 F4800                        ; pequena retração inicial
    G1 Z{z_start + 15} F12000              ; altura segura
    G1 X{x_poop} Y{y_poop} F12000          ; vai para posição do blob

    # === 2. FORMAÇÃO DO BLOB - PRIME ===
    M117 POOP: Prime em Z{z_start}
    G1 Z{z_start} F9000                    ; desce para altura do blob
    M106 S120                              ; ventilador leve (reduzido de 150)
    G1 E{e_prime} F240                     ; prime mais lento e controlado
    G4 P1500                               ; pausa menor (era 2000ms)

    # === 3. EXTRUSÃO COORDENADA DO BLOB (OTIMIZADA) ===
    M117 POOP: Formando blob...
    # Extrusão em 3 etapas para melhor controle:
    G1 Z{z_start + (z_length * 0.4)} E{e_blob * 0.5} F45    ; primeira metade mais rápida
    G1 Z{z_start + (z_length * 0.8)} E{e_blob * 0.3} F35    ; segunda parte
    G1 Z{z_start + z_length} E{e_blob * 0.2} F25            ; finalização ultra-lenta

    # === 4. PREPARAÇÃO ANTI-GRUDAMENTO ===
    M117 POOP: Preparando chute anti-grudamento...
    G4 P800                                ; pausa para estabilizar pressão
    G1 E-{retract_before_move} F4800       ; RETRAÇÃO FORTE antes de mover
    G1 Z{z_chute + 2} F9000               ; sobe bem mais (4.2mm total)
    G1 X{x_chute_start} Y{y_poop} F15000   ; move para posição de chute

    # === 5. CHUTE E LIMPEZA EM ALTURA SEGURA ===
    M117 POOP: Executando chute em Z{z_chute}
    G1 Z{z_chute} F9000                    ; desce para altura de chute (2.2mm)
    
    # Movimento de chute ultra-rápido
    G1 X{x_borda_final} F{chute_speed}     ; chute principal
    
    # Wipe duplo para garantir limpeza
    G1 X{x_wipe_back} F{chute_speed}       ; volta para dentro
    G1 X{x_borda_final} F{chute_speed}     ; segunda passada
    G1 X{x_wipe_back} F{chute_speed}       ; volta novamente

    # === 6. FINALIZAÇÃO SEGURA ===
    M117 POOP: Finalizando...
    G1 E-{retract_final} F3600             ; retração final
    G1 Z30 F12000                          ; altura de segurança máxima
    G1 X100 Y100 F15000                    ; move para centro (opcional)
    M106 S0                                ; desliga ventilador
    G92 E0                                 ; reseta contador de extrusão

    # === RESTAURAR ESTADO ===
    RESTORE_GCODE_STATE NAME=POOP_STATE
    M117 POOP: Concluído - Blob removido!
