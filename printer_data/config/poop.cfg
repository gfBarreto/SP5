[gcode_macro POOP]
description: Rotina de descarte/blob FINAL com Chute e WIPE em Z1.0 (SP5) - ajustada
gcode:
    {% set x_poop = 15 %}              ; X onde forma o blob
    {% set y_poop = 15 %}              ; Y fixo
    {% set x_chute_start = 60 %}       ; início do chute
    {% set x_borda_final = 1 %}        ; “borda” esquerda (não use 0 se seu endstop é sensível)
    {% set z_start = 0.30 %}           ; início do blob
    {% set z_length = 15.0 %}          ; quanto sobe Z enquanto extruda
    {% set extrusion_total = 75.0 %}   ; total de extrusão (mm de filamento)
    {% set e_prime = 10.0 %}           ; prime inicial
    {% set e_rest = extrusion_total - e_prime %}

    ; --- clamps simples para evitar X negativo no wipe ---
    {% set x_wipe = x_borda_final %}
    {% set x_wipe2 = x_borda_final + 3 %}  ; volta 3mm pra dentro (em vez de ir pra negativo)

    M117 POOP: Purga + Chute (SP5)

    ; Guardar estado e padronizar modos
    SAVE_GCODE_STATE NAME=POOP_STATE
    G90                  ; XY absoluto
    M83                  ; extrusão relativa (evita surpresas com M82/M83 do print)
    G92 E0

    ; 1) Movimento seguro e posicionamento
    G1 E-1.0 F4800
    G1 Z{z_start + 10.0} F12000
    G1 X{x_poop} Y{y_poop} F12000

    ; 2) Desce para Z_start, liga fan leve e faz prime
    M117 POOP: Prime em Z{z_start}
    G1 Z{z_start} F9000
    M106 S150
    G1 E{e_prime} F300
    G4 P2000

    ; 3) Extrusão coordenada subindo Z (bem lenta)
    ; Obs: F30 aqui é mm/min no "movimento" (bem lento mesmo). Mantido como você queria.
    M117 POOP: Extrusao sincronizada
    G1 Z{z_start + z_length} E{e_rest} F30

    ; 4) Preparar chute + “depressurizar” antes de encostar em Z1.0
    M117 POOP: Chute + Wipe em Z1.0
    G1 E-0.8 F3600                ; pequena retração pra reduzir baba
    G1 X{x_chute_start} Y{y_poop} F12000
    G1 Z1.0 F9000

    ; 4C) Chute (vai pra borda)
    G1 X{x_borda_final} F18000

    ; 4D) Wipe: volta um pouco pra dentro e retorna (sem X negativo)
    G1 X{x_wipe2} F18000
    G1 X{x_wipe}  F18000

    ; 5) Finalização segura
    G1 Z30 F9000
    M106 S0
    G92 E0

    RESTORE_GCODE_STATE NAME=POOP_STATE
    M117 POOP: OK
