[gcode_macro POOP]
description: POOP SP5 - purge em Z alto + retract + AFASTA (Z maior) após purga + lateral + chute
gcode:
    {% set X_POOP = 10 %}
    {% set Y_POOP = 10 %}

    {% set Z_POOP = 12.0 %}              ; Z durante a purga
    {% set Z_LIFT_AFTER_POOP = 16.0 %}   ; <<< IMEDIATAMENTE após purga: aumenta Z (afasta bico / "desce mesa")
    {% set Z_SAFE = 20.0 %}

    {% set X_CHUTE_START = 60 %}
    {% set X_CHUTE_END = 8 %}
    {% set Z_CHUTE = 0.9 %}
    {% set CHUTE_FEED = 20000 %}
    {% set Z_SNAP = 4.0 %}

    {% set E_PRIME = 4.0 %}
    {% set E_POOP = 50.0 %}
    {% set RETRACT_BEFORE_CHUTE = 3.8 %}
    {% set RETRACT_AFTER_CHUTE = 0.8 %}
    {% set PAUSE_COOL = 3500 %}

    SAVE_GCODE_STATE NAME=POOP_STATE
    G90
    M83
    G92 E0

    ; Prime
    G1 E{E_PRIME} F3600

    ; Vai pro ponto
    G1 Z{Z_SAFE} F3000
    G1 X{X_POOP} Y{Y_POOP} F5000
    G1 Z0.3 F1200

    ; Purga em Z alto
    M106 S100
    G1 X{X_POOP} Y{Y_POOP} Z{Z_POOP} E{E_POOP} F30
    G1 X{X_POOP} Y{Y_POOP} Z{Z_POOP} F300

    ; Resfria
    M106 S255
    G4 P{PAUSE_COOL}
    M106 S0

    ; Retração
    G1 E-{RETRACT_BEFORE_CHUTE} F4800
    M400

    ; <<< CRÍTICO: AFASTA DO BLOB IMEDIATAMENTE APÓS A PURGA >>>
    ; Se você quer "descer a mesa", isso normalmente equivale a AUMENTAR Z
    G90
    G1 Z{Z_LIFT_AFTER_POOP} F1800
    M400

    ; Move lateral (agora em segurança)
    G1 X{X_CHUTE_START} Y{Y_POOP} F8000

    ; Desce para altura do chute
    G1 Z{Z_CHUTE} F1800

    ; Chute duplo
    G1 X{X_CHUTE_END} F{CHUTE_FEED}
    G1 X{X_CHUTE_START} F{CHUTE_FEED}

    ; Snap + retração final
    G1 Z{Z_CHUTE + Z_SNAP} F9000
    G1 E-{RETRACT_AFTER_CHUTE} F4800

    ; Final
    G1 Z{Z_SAFE} F3000
    G92 E0
    RESTORE_GCODE_STATE NAME=POOP_STATE




[gcode_macro TESTE_X]
gcode:
  M118 TESTE_X OK


[gcode_macro rewinder_test]
gcode:
    {% set tool = params.TOOL | default(0) | int %}   ; This target can be set with the drop-down in Mainsail
    {% set cycles = params.CYCLES | default(5) | int %}   ; This target can be set with the drop-down in Mainsail
    {% set speed = params.SPEED | default(300) | float %}   ; This target can be set with the drop-down in Mainsail
    {% set accel = params.ACCEL | default(300) | float %}   ; This target can be set with the drop-down in Mainsail
    {% set length = params.LENGTH | default(800) | float %}   ; This target can be set with the drop-down in Mainsail

    MMU_SELECT TOOL={tool}
    MMU_PRELOAD
    MMU_TEST_LOAD LENGTH=50
    {% for n in range(cycles) %}

        MMU_SERVO POS=DOWN
        MMU_TEST_MOVE SPEED={speed} ACCEL={accel} MOVE={length}
        MMU_SERVO POS=UP
# to stop a macro mid-cycle you must use the e-stop.  This dwell allows you to hit the e-stop while the servo is up so that you can pull the filament out of the ERCF while the printer/macro is stopped
        MMU_SERVO POS=DOWN
        MMU_TEST_MOVE SPEED={speed} ACCEL={accel} MOVE=-{length}
        MMU_SERVO POS=UP

    {% endfor %}

    MMU_UNLOAD

[gcode_macro MMU_AUTOTUNE_G35]
description: Autotune rotation distance (9 gates). NÃO salva automaticamente. Use MMU_AUTOTUNE_G35_SAVE depois.
variable_n: 1
variable_current_gate: -1
variable_current_iter: -1
gcode:
  {% set gates = 9 %}
  {% set cycles = params.CYCLES|default(printer["gcode_macro MMU_AUTOTUNE_G35"].n)|int %}
  {% set single_gate = params.GATE|default(-1)|int %}

  M118 MMU_AUTOTUNE_G35 INICIO | ciclos={cycles} | gate={single_gate} (-1=todos)

  MMU_TEST_CONFIG autotune_rotation_distance=1

  {% if single_gate >= 0 and single_gate <= 8 %}
    {% for i in range(cycles) %}
      SET_GCODE_VARIABLE MACRO=MMU_AUTOTUNE_G35 VARIABLE=current_iter VALUE={i}
      SET_GCODE_VARIABLE MACRO=MMU_AUTOTUNE_G35 VARIABLE=current_gate VALUE={single_gate}

      MMU_UNLOCK
      MMU_CHECK_GATE GATE={single_gate}
      {% set status = (printer.mmu.gate_status[single_gate]|default("Unknown"))|string %}
      {% set status_l = status|lower %}

      {% if status_l not in ["empty","unknown"] %}
        M118 G{single_gate} ({status}) | ciclo {i+1}/{cycles}: iniciando
        MMU_SELECT GATE={single_gate}
        MMU_PRELOAD
        MMU_LOAD
        MMU_UNLOAD
        M118 G{single_gate} ({status}) | ciclo {i+1}/{cycles}: OK
      {% else %}
        M118 Pulando G{single_gate}: {status}
      {% endif %}
    {% endfor %}
  {% else %}
    {% for i in range(cycles) %}
      {% for g in range(0, gates) %}
        SET_GCODE_VARIABLE MACRO=MMU_AUTOTUNE_G35 VARIABLE=current_iter VALUE={i}
        SET_GCODE_VARIABLE MACRO=MMU_AUTOTUNE_G35 VARIABLE=current_gate VALUE={g}

        MMU_UNLOCK
        MMU_CHECK_GATE GATE={g}
        {% set status = (printer.mmu.gate_status[g]|default("Unknown"))|string %}
        {% set status_l = status|lower %}

        {% if status_l not in ["empty","unknown"] %}
          M118 G{g} ({status}) | ciclo {i+1}/{cycles}: iniciando
          MMU_SELECT GATE={g}
          MMU_PRELOAD
          MMU_LOAD
          MMU_UNLOAD
          M118 G{g} ({status}) | ciclo {i+1}/{cycles}: OK
        {% else %}
          M118 Pulando G{g}: {status}
        {% endif %}
      {% endfor %}
    {% endfor %}
  {% endif %}

  MMU_TEST_CONFIG autotune_rotation_distance=0

  M118 MMU_AUTOTUNE_G35 FIM | ciclos={cycles} | last_gate={printer['gcode_macro MMU_AUTOTUNE_G35'].current_gate} | last_iter={printer['gcode_macro MMU_AUTOTUNE_G35'].current_iter}
  M118 Agora rode: RELATORIO_G35  (para ver vars) e depois SAVE_CONFIG (se estiver ok)

[gcode_macro RELATORIO_G35]
gcode:
  {% set ns = namespace() %}
  {% set config_name = "mmu" %}
  
  {% if config_name not in printer %}
    M118 Erro: Secao [{config_name}] nao encontrada na configuracao do printer.
    {action_respond_info("Erro: Secao [%s] nao encontrada na configuracao do printer." % config_name)}
  {% else %}
    {% set mmu_config = printer[config_name] %}
    M118 === MMU Configuration Report ===
    
    {% for key, value in mmu_config.items() %}
      M118 {key}: {value}
    {% endfor %}
    
    M118 === End MMU Report ===
  {% endif %}
  M118 MMU_G35REPORT finalizado.


