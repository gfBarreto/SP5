[gcode_macro AJUSTE_PARAFUSOS]
description: Zera eixos, (opcional) Z_TILT, e SCREWS_TILT_CALCULATE com controle inteligente de aquecimento.
# Temperatura padrão caso você não passe BED=
variable_default_bed: 80
variable_extruder_temp: 155
# "Perto" do alvo: se a mesa estiver a (alvo - near_delta) ou mais, consideramos "já quente"
variable_near_delta: 5.0

gcode:
    {% set BED_TEMP = params.BED|default(printer["gcode_macro AJUSTE_PARAFUSOS"].default_bed)|float %}
    {% set EXTRUDER_TEMP = printer["gcode_macro AJUSTE_PARAFUSOS"].extruder_temp|float %}
    {% set NEAR_DELTA = printer["gcode_macro AJUSTE_PARAFUSOS"].near_delta|float %}

    {% set bed_now = printer.heater_bed.temperature|float %}
    {% set bed_target_now = printer.heater_bed.target|float %}

    M117 Ajuste Parafusos: alvo mesa {BED_TEMP}C

    # 1) Decide se precisa aquecer a mesa (se já estiver "perto", não fica perguntando/forçando)
    {% if bed_now >= (BED_TEMP - NEAR_DELTA) %}
        M117 Mesa ja quente ({bed_now|round(1)}C). Mantendo/ajustando alvo...
        M140 S{BED_TEMP}
    {% else %}
        # "Pergunta": aqui, na prática, você define a temp chamando BED=...
        # Ex.: AJUSTE_PARAFUSOS BED=70
        M117 Mesa fria ({bed_now|round(1)}C). Aquecendo para {BED_TEMP}C...
        M140 S{BED_TEMP}
    {% endif %}

    # 2) Quando estiver chegando perto da temp da mesa, aquece o bico a 155C
    # Espera a mesa chegar em (alvo - 2C) antes de começar a aquecer o bico.
    {% set bed_preheat_trigger = BED_TEMP - 2.0 %}
    {% if bed_preheat_trigger < 0 %}
        {% set bed_preheat_trigger = 0 %}
    {% endif %}

    M117 Aguardando mesa ~{bed_preheat_trigger|round(1)}C para aquecer bico...
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_preheat_trigger}

    M117 Aquecendo bico a {EXTRUDER_TEMP}C...
    M104 S{EXTRUDER_TEMP}

    # 3) Agora estabiliza as temperaturas finais
    M117 Estabilizando mesa em {BED_TEMP}C...
    M190 S{BED_TEMP}

    M117 Estabilizando bico em {EXTRUDER_TEMP}C...
    M109 S{EXTRUDER_TEMP}

    M117 Temperaturas prontas. Iniciando rotinas...

    # 4) Home
    G28

    # 5) Z_TILT opcional
    {% if printer.configfile.settings['z_tilt'] is defined %}
        M117 Alinhando fusos Z (Z_TILT_ADJUST)...
        Z_TILT_ADJUST
    {% else %}
        M117 Z_TILT nao configurado. Pulando.
    {% endif %}

    # 6) Move para o centro
    G1 Z10 F1200
    G1 X150 Y150 F3000

    # 7) Screws tilt
    M117 Executando SCREWS_TILT_CALCULATE...
    SCREWS_TILT_CALCULATE

    M117 Ajuste os parafusos e repita se necessario.

    
[gcode_macro START_PRINT]
description: "Macro principal chamado pelo Orca Slicer. Recebe temperaturas, otimiza o aquecimento e inicia a sequencia principal."
gcode:
    # 1. RECEBIMENTO DE PARÂMETROS DO SLICER (Orca)
    # Estes parâmetros são enviados pelo G-code inicial do Orca.
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set nozzle_temp = params.EXTRUDER_TEMP|default(220)|float %}
    
    # --- LÓGICA DE CONFIGURAÇÃO ---
    {% set file = printer["print_stats"].filename|default("")|upper %}
    {% set is_abs_or_tritan = "ABS" in file or "TRITAN" in file %}

    # 2. INÍCIO DO AQUECIMENTO DA MESA E PRÉ-AQUECIMENTO DO BICO (EM PARALELO)
    M117 Aguardando Mesa e Bico Aquecerem...
    RESPOND TYPE=command MSG="print_started"
    
    M140 S{bed_temp} # Começa a aquecer a mesa (não espera - M190 virá depois)
    M104 S155       # Começa o pré-aquecimento do bico a 155°C (não espera)
    
    LED_AQUECIMENTO_MESA_PROGRESSIVO # Macro personalizado para LED
    
    # 3. ESPERA PELO PRÉ-AQUECIMENTO DO BICO (RÁPIDO)
    M117 Pré-aquecendo o bico a 155°C para Homing seguro...
    M109 S155 # ESPERA O BICO ATINGIR 155°C

    # 4. HOMING, AJUSTE E CALIBRAÇÃO (Mesa Aquecendo em Background)
    M117 Fazendo Home, Ajuste de Z e Mesh (Mesa Aquecendo)...
    G28             # Homing (X, Y, Z)
    Z_TILT_ADJUST   # Seu ajuste de Z-Tilt
    BED_MESH_CALIBRATE ADAPTIVE=1 # Calibração da malha apenas na área da peça

    # 5. AQUECIMENTO FINAL DO HOTEND E ESPERA FINAL
    M117 Aquecimento Final do Hotend e Espera pela Mesa...
    
    # O Hotend continua aquecendo (ou reaquece se esfriou)
    M104 S{nozzle_temp}
    
    # Espera pela Mesa (M190) e pelo Bico (M109) ao mesmo tempo.
    # O código só continua quando AMBOS atingirem suas temperaturas finais.
    M190 S{bed_temp}  
    M109 S{nozzle_temp} 

    # 6. LÓGICA CONDICIONAL (ABS/TRITAN)
    {% if is_abs_or_tritan %}
      M117 Ligando Nevermore...
      NEVERMORE_ON # Macro personalizado para Nevermore (Filtro de ar)
    {% endif %}

    # 7. PREPARAÇÃO FINAL DA EXTRUSORA E PURGE
    {% set final_msg = '"Bico a %.0f°C! Iniciando impressão..."' % nozzle_temp %}
    M117 {final_msg}
    
    G90
    G92 E0

    CLEAN_AND_PURGE # Seu macro de limpeza/purge (Idealmente faz a linha de purge)

    # Pequeno Retrair para evitar blobbing antes do início da peça
    G1 E-0.8 F300 
    G92 E0

    M117 Impressão Iniciada!
    LED_BRANCO # Macro LED final

[gcode_macro MMU_RESET_CONFIRMADO]
description: Reinicia o TR
gcode:
    MMU_RESET CONFIRM=1


[gcode_macro FILAMENT_CUT]
description: Executa o movimento completo de corte do filamento na SP5
gcode:
    {% set x_inicio = 277 %}
    {% set y_inicio = 280 %}
    {% set x_corte = 294 %}
    {% set y_corte = 280 %}
    {% set x_retorno = 250 %}
    {% set vel_normal = 12000 %}
    {% set vel_lento = 600 %}

    M117 Iniciando corte de filamento...
    G90
    FC_deploy
    G1 X{x_inicio} Y{y_inicio} F{vel_normal}    ; vai até a posição inicial de corte                                   
    G4 P500

    M117 Cortando...
    G1 X{x_corte} Y{y_corte} F{vel_lento}       ; faz o corte lentamente
    G4 P300

    M117 Recuando...
    G1 X{x_retorno} F{vel_normal}               ; recua 10 mm
    FC_retract                                  ; recolhe o braço
    G4 P500

    M117 Corte concluído.


